# The fuzzing harness (cargo-fuzz). Not a workspace member: it needs
# nightly + libfuzzer and its own lint posture.
[package]
name = "iiif-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

# Lint canon: renovate-config templates/rust-lints/Cargo-lints.toml —
# mirrored from the main workspace (this manifest cannot inherit). Keep in
# lockstep.
[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
elided_lifetimes_in_paths = "warn"
let_underscore_drop = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
non_ascii_idents = "warn"
unit_bindings = "warn"
meta_variable_misuse = "warn"
unused_lifetimes = "warn"
redundant_lifetimes = "warn"
unnameable_types = "warn"
variant_size_differences = "warn"
single_use_lifetimes = "warn"
explicit_outlives_requirements = "warn"
rust-2024-compatibility = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
redundant_pub_crate = "allow"
multiple_crate_versions = "allow"
unwrap_used = "warn"
expect_used = "warn"
undocumented_unsafe_blocks = "warn"
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
print_stderr = "warn"

[dependencies]
libfuzzer-sys = "0.4"
iiif-core = { path = "../crates/core" }

[[bin]]
name = "url_grammar"
path = "fuzz_targets/url_grammar.rs"
test = false
doc = false
bench = false

[[bin]]
name = "identifier"
path = "fuzz_targets/identifier.rs"
test = false
doc = false
bench = false

[[bin]]
name = "v2_grammar"
path = "fuzz_targets/v2_grammar.rs"
test = false
doc = false
bench = false

[[bin]]
name = "master_open"
path = "fuzz_targets/master_open.rs"
test = false
doc = false
bench = false
