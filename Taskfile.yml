---
version: "3"

# Every command runs with bash strict mode: exit on error, unset vars are
# errors, pipeline failures propagate.
set: [errexit, nounset, pipefail]

# Parallel deps interleave output; prefix each line with its task name.
output: prefixed

vars:
  # Pinned nightly rustfmt: the canonical config (rustfmt.toml, from
  # renovate-config templates/rustfmt/) uses nightly-only options — the
  # second sanctioned nightly exception after cargo-fuzz. No Renovate
  # datasource exists for dated nightlies; bump manually alongside stable
  # toolchain bumps. Hooks, tasks and CI all read this one value.
  RUSTFMT_TOOLCHAIN: nightly-2026-07-20

tasks:
  ci:
    desc: Everything CI runs — the full gate, identical locally and on GitHub
    deps: [lint, test]

  test:
    desc: Run the test suite (all crates, all features)
    # Fingerprinted: unchanged inputs skip the run; task --force overrides.
    method: checksum
    sources: &rust-sources
      - "**/*.rs"
      - "**/Cargo.toml"
      - Cargo.lock
      - mise.toml
      - mise.lock
      - exclude: "**/target/**"
    cmds:
      - cargo test --workspace --all-features

  fmt:
    desc: Apply all formatters
    cmds:
      - cargo +{{.RUSTFMT_TOOLCHAIN}} fmt --all
      - cargo +{{.RUSTFMT_TOOLCHAIN}} fmt --manifest-path fuzz/Cargo.toml
      - taplo fmt
      - shfmt -w .

  fmt:toolchain:
    desc: Install the pinned nightly rustfmt (idempotent; CI + fresh clones)
    cmds:
      - rustup toolchain install {{.RUSTFMT_TOOLCHAIN}} --profile minimal --component rustfmt

  lint:
    desc: Run every linter over the whole repository
    deps:
      - lint:rust
      - lint:deny
      - lint:toml
      - lint:yaml
      - lint:md
      - lint:spell
      - lint:ec
      - lint:actions
      - lint:shell
      - lint:docker
      - lint:machete

  lint:rust:
    desc: rustfmt (check) + clippy, warnings as errors
    method: checksum
    sources: *rust-sources
    cmds:
      - task: lint:fmt-check
      - cargo clippy --workspace --all-features --all-targets -- -D warnings

  lint:fmt-check:
    desc: rustfmt check, both workspaces, pinned nightly
    cmds:
      - cargo +{{.RUSTFMT_TOOLCHAIN}} fmt --all --check
      # fuzz is outside the workspace; keep fmt honest there.
      - cargo +{{.RUSTFMT_TOOLCHAIN}} fmt --check --manifest-path fuzz/Cargo.toml

  lint:deny:
    desc: cargo-deny (advisories, licenses, bans, sources)
    # Deliberately NOT fingerprinted: the advisories check reads the RustSec
    # database, which changes without commits — a source-checksum skip is
    # unsound for any security gate. New advisories must turn this red.
    cmds:
      - cargo deny check -D unmatched-skip

  lint:toml:
    desc: taplo format-check + lint over all TOML
    method: checksum
    sources:
      # mise.toml/mise.lock are TOML — the file class already covers the pin
      - "**/*.toml"
      - exclude: "**/target/**"
    cmds:
      - taplo fmt --check
      - taplo lint

  lint:yaml:
    desc: yamllint (strict) over all YAML
    method: checksum
    sources:
      - "**/*.yml"
      - "**/*.yaml"
      - .yamllint
      - mise.toml
      - mise.lock
    cmds:
      - yamllint --strict .

  lint:md:
    desc: markdownlint over all Markdown
    method: checksum
    sources:
      - "**/*.md"
      - .markdownlint-cli2.jsonc
      - mise.toml
      - mise.lock
    cmds:
      - markdownlint-cli2

  lint:spell:
    desc: codespell over the repository
    method: checksum
    sources: &whole-tree-sources
      - "**/*"
      - .codespellrc
      - exclude: .task/**
      - exclude: .git/**
      - exclude: "**/target/**"
      - exclude: tests/fixtures/**
      - exclude: fuzz/corpus/**
      - exclude: fuzz/artifacts/**
      - exclude: spikes/out/**
    cmds:
      - codespell

  lint:ec:
    desc: editorconfig-checker over all tracked files
    method: checksum
    sources: *whole-tree-sources
    cmds:
      - ec

  lint:actions:
    desc: actionlint + zizmor over GitHub Actions workflows
    method: checksum
    sources:
      - .github/workflows/**
      - mise.toml
      - mise.lock
    cmds:
      - actionlint
      - zizmor --persona=pedantic --offline .github/

  lint:docker:
    desc: hadolint over Dockerfiles (bench harness only — nothing ships in one)
    method: checksum
    sources:
      - "**/Dockerfile"
      - .hadolint.yaml
    cmds:
      - hadolint --config .hadolint.yaml tools/bench/cantaloupe/Dockerfile

  lint:shell:
    desc: shellcheck + shfmt (check mode) over shell scripts
    method: checksum
    sources:
      - "**/*.sh"
      - .shellcheckrc
      - mise.toml
      - mise.lock
      - exclude: "**/target/**"
    cmds:
      - shfmt -d .
      - |
        files=$(shfmt --find .)
        [ -z "$files" ] || shellcheck $files

  lint:machete:
    desc: cargo-machete (unused dependencies, metadata mode)
    # Deterministic given the lock (verified lockfile-untouched); canon:
    # renovate-config templates/cargo-machete/README.md.
    method: checksum
    sources: *rust-sources
    cmds:
      - cargo machete --with-metadata

  scan:secrets:
    desc: gitleaks over the full git history
    # Not fingerprinted: the input is git history, which sources: cannot
    # see. The staged-changes layer is the universal pre-commit hook.
    # Canon: renovate-config templates/gitleaks/README.md.
    cmds:
      - gitleaks git --no-banner --redact --verbose .

  validate:
    desc: Run the official IIIF validator (v3 level 2) against a local build
    cmds:
      - scripts/validate.sh

  fixtures:gen:
    desc: Regenerate the committed test masters (requires libvips via mise)
    cmds:
      - scripts/gen_fixtures.sh

  spike1:
    desc: "SPIKE 1: JPEG-in-TIFF goldens vs libvips (generates fixtures, runs ignored tests)"
    cmds:
      - scripts/gen_spike1.sh
      - cargo test --release -p iiif-core --test spike1_jpeg_in_tiff -- --ignored --nocapture

  spike2:
    desc: "SPIKE 2: j2k vs OpenJPEG goldens + region-at-scale perf"
    cmds:
      - scripts/gen_spike2.sh
      - cargo test --release -p iiif-core --test spike2_j2k_vs_openjpeg -- --ignored --nocapture

  spike:objstore:
    desc: Object-store range-read profile vs Docker MinIO (Hetzner = env swap)
    cmds:
      - scripts/spike_objstore.sh

  spike:alloc:
    desc: "Allocator bench: musl malloc vs mimalloc in a musl container"
    cmds:
      - scripts/spike_alloc.sh

  fuzz:
    desc: Fuzz all targets briefly (nightly + cargo-fuzz); FUZZ_SECONDS to extend
    vars:
      FUZZ_SECONDS: '{{.FUZZ_SECONDS | default "60"}}'
    cmds:
      - for: [url_grammar, identifier, v2_grammar, master_open]
        cmd: >-
          cargo +nightly fuzz run {{.ITEM}} --
          -max_total_time={{.FUZZ_SECONDS}} -rss_limit_mb=4096 -malloc_limit_mb=2048

  bench:
    desc: "M2 gate: our latency vs libvips on the same masters (BENCH_REPS to extend)"
    cmds:
      - scripts/bench_libvips.sh

  e2e:s3:
    desc: End-to-end object-store serving vs Docker MinIO (pixel-verified)
    cmds:
      - scripts/e2e_s3.sh
