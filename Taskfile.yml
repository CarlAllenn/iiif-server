---
version: "3"

tasks:
  test:
    desc: Run the test suite (all crates, all features)
    cmds:
      - cargo test --workspace --all-features

  fmt:
    desc: Format all code
    cmds:
      - cargo fmt --all
      - taplo fmt
      - shfmt -w .

  lint:
    desc: All linters, warnings as errors
    cmds:
      - cargo clippy --workspace --all-features --all-targets -- -D warnings
      - cargo deny check
      - taplo fmt --check
      - taplo lint
      - yamllint --strict .
      - markdownlint-cli2
      - ec
      - codespell
      - actionlint
      - zizmor --min-severity low .github/workflows/
      - shfmt -d .
      - |
        files=$(shfmt --find .)
        [ -z "$files" ] || shellcheck $files

  validate:
    desc: Run the official IIIF validator (v3 level 2) against a local build
    cmds:
      - scripts/validate.sh

  fixtures:gen:
    desc: Regenerate the committed test masters (requires libvips via mise)
    cmds:
      - scripts/gen_fixtures.sh

  spike1:
    desc: "SPIKE 1: JPEG-in-TIFF goldens vs libvips (generates fixtures, runs ignored tests)"
    cmds:
      - scripts/gen_spike1.sh
      - cargo test --release -p iiif-core --test spike1_jpeg_in_tiff -- --ignored --nocapture

  spike2:
    desc: "SPIKE 2: j2k vs OpenJPEG goldens + region-at-scale perf"
    cmds:
      - scripts/gen_spike2.sh
      - cargo test --release -p iiif-core --test spike2_j2k_vs_openjpeg -- --ignored --nocapture

  spike:objstore:
    desc: "Object-store range-read profile vs Docker MinIO (Hetzner = env swap)"
    cmds:
      - scripts/spike_objstore.sh

  spike:alloc:
    desc: "Allocator bench: musl malloc vs mimalloc in a musl container"
    cmds:
      - scripts/spike_alloc.sh

  e2e:s3:
    desc: End-to-end object-store serving vs Docker MinIO (pixel-verified)
    cmds:
      - scripts/e2e_s3.sh

  check:
    desc: Format check + lint + tests (what CI runs)
    cmds:
      - cargo fmt --all --check
      - task: lint
      - task: test
