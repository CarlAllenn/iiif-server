[workspace]
resolver = "3"
members = ["crates/core", "crates/server", "crates/sources"]
# The fuzz harness builds with nightly + libfuzzer on its own.
exclude = ["fuzz"]

[workspace.package]
version = "0.0.0"
edition = "2024"
# MSRV floor is set by j2k; stated in README, enforced in CI.
rust-version = "1.96"
license = "AGPL-3.0-only"
publish = false

[workspace.dependencies]
# Explicit version alongside path: cargo-deny's wildcard ban applies to
# path-only deps too, and it is right — versionless deps break the day a
# crate is consumed outside the workspace.
iiif-core = { path = "crates/core", version = "0.0.0" }
iiif-sources = { path = "crates/sources", version = "0.0.0" }
bytes = "1"
serde_json = "1"
tokio = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# Max enforcement, no exemptions: the whole pedantic tier is on and the code
# complies — there are no `allow` attributes in this workspace.
pedantic = { level = "warn", priority = -1 }

# TEMPORARY (issue #21): j2k pinned to our fork carrying the fix for
# frames-sg/j2k#62 (region decode returned shifted content whenever a
# back-propagated ROI window kept a left/top margin). Upstream PR:
# https://github.com/frames-sg/j2k/pull/63. Repoint at the upstream rev
# when it merges; delete this section (and deny.toml's allow-git entry)
# when the fix is released. Tracked-class doctrine: no permanent forks.
[patch.crates-io]
j2k = { git = "https://github.com/CarlAllenn/j2k", rev = "950a5762a51664d692944005225380c310d04b0f" }
