# Settings block: canonical baseline from CarlAllenn/renovate-config
# templates/mise/settings.toml — drift-audited, do not edit locally.
min_version = "2026.7.12"

[settings]
lockfile = true                 # mise.lock records resolved versions + checksums
pin = true                      # `mise use` writes exact versions, never ranges
activate_aggressive = true      # tool bin-paths go to FRONT of PATH (system tools can never shadow pins)
locked_verify_provenance = true # re-verify provenance on install even when the lockfile has entries
# Strict mode: install only from pre-resolved lockfile URLs — no registry/API
# resolution, and ad-hoc `mise x tool@ver` installs of unpinned tools fail
# (mechanical no-ad-hoc enforcement).
locked = true
# Never install a release younger than 7 days — the same number as the
# Renovate minimumReleaseAge and pnpm gates (three-layer policy, issue #5;
# see templates/pnpm/README.md). pipx:/npm: forward this into transitive
# dependency resolution.
minimum_release_age = "168h"
# Dev Mac + CI runners; the default would also lock musl/windows we never target.
lockfile_platforms = ["macos-arm64", "linux-x64", "linux-arm64"]
# asdf plugins are legacy (single-maintainer bash, no checksums); ubi is
# deprecated upstream in favor of github:.
disable_backends = ["asdf", "ubi"]
# Precompiled ruby (jdx/ruby) rather than a ruby-build source compile.
# Measured in monumental-archive (#150): 364s of a 394s cold CI install was
# one `make -j 2`; the precompiled path is 5s and arrives with a checksum AND
# GitHub artifact attestations, which the cache.ruby-lang.org tarball has not.
# Set explicitly even though mise makes it the default in 2026.8.0: lockfile
# entries are matched on `options` exactly, so the default flip invalidates
# every existing ruby entry — and non-major mise bumps automerge as silent
# branch pushes, so that would land unattended. Setting it here means the
# change arrives with a reviewed `mise lock`, once, per repo. Repos with no
# ruby pin are unaffected. If no precompiled build exists for a version, the
# locked-mode install fails loudly rather than quietly recompiling (verified).
ruby.compile = false

# Bootstrap guarantee: a fresh clone gets its git hooks installed by the
# standard `mise install`; without this, .git/hooks/ is empty and the whole
# enforcement layer silently doesn't exist. Idempotent; lefthook auto-resyncs
# hooks on every run thereafter.
# CI-guarded (same convention as lefthook's own npm postinstall): git hooks
# are meaningless in CI, and installing them there fetches the remote config
# into .git/, which whole-repo scanners must then be excluded from.
[hooks]
postinstall = 'test -n "${CI:-}" || lefthook install'

[tools]
rust = { version = "1.97.1", components = "rustfmt,clippy" }
task = "3.52.0"

# Enforcement layer (max: every text format has a linter, warnings are errors)
lefthook = "2.1.10"
actionlint = "1.7.12"
# GitHub Actions security audit
"aqua:zizmorcore/zizmor" = "1.28.0"
taplo = "0.10.0"
yamllint = "1.38.0"
editorconfig-checker = "3.8.0"
uv = "0.11.31"
"pipx:codespell" = "2.4.3"
"aqua:EmbarkStudios/cargo-deny" = "0.20.2"
# unused deps (metadata mode); not in aqua
"github:bnjbvr/cargo-machete" = "0.9.2"
# libFuzzer driver (fuzz.yml); runs cargo +nightly itself
"cargo:cargo-fuzz" = "0.13.2"
# bench-harness Dockerfile (issue #8: every format linted)
hadolint = "2.14.0"
# per-PR coverage visibility (no threshold gate)
"aqua:taiki-e/cargo-llvm-cov" = "0.8.7"
shellcheck = "0.11.0"
shfmt = "3.13.1"
# secret scan: staged (universal hook) + CI history job
gitleaks = "8.30.1"
# link check, weekly scheduled.yml only
lychee = "0.24.2"
# CVE scan of the built container image (task scan:image, gated in ci.yml).
# Same pin as monumental-archive, which scans its images the same way.
trivy = "0.72.0"
# Keyless signing of the released image (publish.yml). Pinned here rather
# than installed by sigstore/cosign-installer for the same reason every other
# tool is: one pinned, checksummed source.
cosign = "3.1.2"
# Release phase 1: next version from conventional commits + CHANGELOG.md.
# Neither release-plz nor release-please can drive this workspace — both
# assume a shape it does not have (docs/release-engineering.md records the
# evidence), so the Release PR is assembled from this plus `gh`.
"aqua:orhun/git-cliff" = "2.13.1"

# Fixture tools (libvips/openjpeg/libmagic) live in tools/fixtures/mise.toml
# — see the note there about conda-backend lockfile limits.
# runtime for markdownlint-cli2
node = "26.5.0"
"npm:markdownlint-cli2" = "0.23.1"
