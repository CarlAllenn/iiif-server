# Canonical rustfmt baseline — copy-template class (issue #8, 2026-07-27).
#
# Runs on a mise/rustup-PINNED nightly rustfmt (the unstable options below are
# nightly-only): the format gate is the second sanctioned nightly exception,
# same doctrine as cargo-fuzz. "Nightly" is the channel name, not a schedule —
# the pinned build runs on demand like any tool, and only Renovate moves it.
# Every option here is a deliberate non-default (or a default pinned because
# tools infer it inconsistently); removals need a recorded reason.

# rustfmt standalone defaults style_edition to 2015 while `cargo fmt` infers
# it from Cargo.toml — pin it so the two can never disagree.
style_edition = "2024"
unstable_features = true

# One `use` per crate, grouped std / external / local — imports become
# mechanically canonical, diffs stop churning on merge order.
imports_granularity = "Crate"
group_imports = "StdExternalCrate"

# Comments are code: width-wrapped, block comments normalized to line style,
# doc attributes to ///, and code inside doc comments formatted like any
# other code.
wrap_comments = true
comment_width = 80
normalize_comments = true
normalize_doc_attributes = true
format_code_in_doc_comments = true

format_macro_matchers = true
# format_strings stays OFF (recorded reason): it splits long string literals
# with mid-literal backslash continuations — mangles readability and invites
# accidental content edits. error_on_unformatted below still refuses overlong
# strings, so a human wraps them sensibly instead.
format_strings = false
hex_literal_case = "Upper"
condense_wildcard_suffixes = true
reorder_impl_items = true
use_field_init_shorthand = true
use_try_shorthand = true
match_block_trailing_comma = true

# The gate is a gate: anything rustfmt cannot bring under max_width is an
# error to fix at the source, never silently left overlong.
error_on_line_overflow = true
error_on_unformatted = true
