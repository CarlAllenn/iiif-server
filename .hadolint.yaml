---
# hadolint canon: renovate-config templates/hadolint/ — drift-audited.
# Max enforcement: style-or-above fails, inline pragmas disabled; every
# exemption is config-level here with its reason.
failure-threshold: style
disable-ignore-pragma: true
trustedRegistries:
  - docker.io
strict-labels: false
ignored:
  # DL3005 (canonical): apt-get upgrade keeps base-OS security patches
  # current between base-image rebuilds; style loses to patch posture.
  - DL3005
  # DL3008 (this repo): Ubuntu's archive rotates point releases out, so
  # pinned apt versions break rebuilds of the Cantaloupe bench harness —
  # a non-shipping comparison image.
  - DL3008
  # DL3018 (this repo): same rotation problem on Alpine, and the only apk
  # install we make is in the *builder* stage of the shipping image — the
  # final stage is FROM scratch, so no apk package is ever distributed. What
  # reaches users is pinned where it matters: base images by digest, Rust
  # dependencies by the committed lockfile with --locked.
  - DL3018
