[package]
name = "iiif-core"
description = "Pure library: IIIF URL grammar, image pipeline, info.json, codec traits. No I/O in the grammar layer."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
bytes.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Tracked class (parses semi-trusted master bytes; security watch forever)
tiff = "0.11"
zune-jpeg = "0.5"
png = "0.18"
j2k = "0.7"
# Pin-forever class (pure compute, no hostile bytes)
num-traits = "0.2"
fast_image_resize = "6"
jpeg-encoder = "0.7"
gif = "0.14"
image-webp = "0.2"

[dev-dependencies]
proptest = "=1.11.0"

[lints]
workspace = true
