[package]
name = "iiif-server"
description = "The server binary: hyper 1.x directly on tokio, no web framework."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "iiif-server"
path = "src/main.rs"

[dependencies]
iiif-core.workspace = true
iiif-sources.workspace = true
bytes.workspace = true
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["server", "tokio", "http1"] }
http-body-util = "0.1"
tokio = { workspace = true, features = ["rt-multi-thread", "net", "macros", "signal", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Optional allocator: C, but trusted-compute C that never parses hostile
# bytes (design spec, Allocator). The M0 bench decides whether it ships.
mimalloc = { version = "0.1", optional = true }

[dev-dependencies]
serde_json = "=1.0.151"

[features]
# Bench-decided (docs/spikes/alloc-bench.md): musl's malloc serializes the
# concurrent decode workload; mimalloc measured ~2x. Trusted-compute C that
# never parses hostile bytes — the headline stays "zero C parsing
# untrusted input". Opt out with --no-default-features.
default = ["mimalloc"]
mimalloc = ["dep:mimalloc"]

[lints]
workspace = true
