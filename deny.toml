# Dependency policy. The workspace itself is AGPL-3.0-only (unpublished, so
# exempted below); every dependency must be permissive — verified here, forever.
[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# Exactly the licenses present in the tree today — extended deliberately,
# fail-closed, when a new dependency arrives with a new (permissive) one.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "Unicode-3.0",
  # jpeg-encoder is (MIT OR Apache-2.0) AND IJG; IJG is the Independent
  # JPEG Group's permissive notice license (FSF Free/Libre).
  "IJG",
]
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
