# Dependency policy. The workspace itself is AGPL-3.0-only (unpublished, so
# exempted below); every dependency must be permissive — verified here, forever.
[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# Exactly the licenses present in the tree today — extended deliberately,
# fail-closed, when a new dependency arrives with a new (permissive) one.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "Unicode-3.0",
  # jpeg-encoder is (MIT OR Apache-2.0) AND IJG; IJG is the Independent
  # JPEG Group's permissive notice license (FSF Free/Libre).
  "IJG",
  # The object_store/rustls tree (M4 sources): ring & rustls are ISC,
  # subtle is BSD-3-Clause, webpki-root-certs data is CDLA-Permissive-2.0.
  "ISC",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
]
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# Temporary (issue #21): the j2k fork carrying the frames-sg/j2k#62 fix,
# pinned by rev in [patch.crates-io]. Remove with the patch.
allow-git = ["https://github.com/CarlAllenn/j2k"]
