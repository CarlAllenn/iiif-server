---
name: Fuzz

# Coverage-guided deep fuzzing (cargo-fuzz/libFuzzer), canonical pattern
# from edtf's fuzz.yml (issue #8 de-drift). Not a push gate: nightly
# schedule or on demand. Nightly toolchain is confined to this workflow (a
# sanctioned exception to the everything-via-mise rule; cargo-fuzz itself
# is pinned in mise.toml).

"on":
  schedule:
    - cron: 17 4 * * *
  workflow_dispatch:
    inputs:
      max_total_time:
        description: Seconds of fuzzing per target
        default: "1200"

permissions:
  contents: read

# One fuzz run per ref at a time; an in-progress run is doing useful work,
# so a newer trigger queues rather than cancels.
concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fuzz:
    name: cargo fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [url_grammar, identifier, v2_grammar, master_open]
    steps:
      # First step of every job, before checkout: runtime egress audit —
      # enforcement per issue #6 canon (allowlist derived from audit run;
      # templates/ci/ in renovate-config).
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          disable-sudo: true
          # Derived from the audit run plus the GitHub-owned
          # cold-cache set (mise tool installs on cache miss).
          # *.githubapp.com is GitHub's own hosted-compute plane
          # (watchdog/orchestrator); blocking it correlated with runners
          # being reaped mid-run on long fuzz jobs (2026-08-07 nightly).
          allowed-endpoints: >
            *.githubapp.com:443
            api.github.com:443
            codeload.github.com:443
            crates.io:443
            github.com:443
            index.crates.io:443
            mise-versions.jdx.dev:443
            mise.jdx.dev:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            static.crates.io:443
            static.rust-lang.org:443
            tuf-repo-cdn.sigstore.dev:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.7.12
          cache_key_prefix: mise-fuzz-v1
          # Single-purpose job: install only its own tools (canon rule,
          # templates/ci/README.md).
          install_args: rust cargo:cargo-fuzz
      - run: rustup toolchain install nightly --profile minimal
      # Corpus persists across runs via the cache (CI-cached, never
      # committed — issue #8 decision). run_id keys make every save unique;
      # restore takes the newest prefix match.
      - name: Restore corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - name: Fuzz
        env:
          FUZZ_TARGET: ${{ matrix.target }}
          MAX_TOTAL_TIME: ${{ github.event.inputs.max_total_time || 1200 }}
        run: |
          cargo +nightly fuzz run "$FUZZ_TARGET" -- \
            -max_total_time="$MAX_TOTAL_TIME" \
            -rss_limit_mb=4096 -malloc_limit_mb=2048 \
            -timeout=10
      # Minimize before saving: keeps the cached corpus dense (every entry
      # exercises a distinct path) instead of growing without bound.
      - name: Minimize corpus
        if: always()
        env:
          FUZZ_TARGET: ${{ matrix.target }}
        run: cargo +nightly fuzz cmin "$FUZZ_TARGET"
      # Save even on crash-failure runs — a crash-finding corpus is the most
      # valuable corpus there is.
      - name: Save corpus
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/
          if-no-files-found: ignore
