---
name: ci

"on":
  push:
    # renovate/lock-file-maintenance*: branch-automerge needs the ci check
    # on the branch itself (no PR is opened unless the branch goes red).
    branches: [main, "renovate/lock-file-maintenance*"]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch supersedes any run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint + test (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        # Both shipping architectures; arm64 runners are free on public
        # repos.
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.7.12
      - env:
          # zizmor: enables online audits (known-vulnerable-actions etc.)
          GH_TOKEN: ${{ github.token }}
        run: task check

  validate:
    name: Official IIIF validators (v3 + v2.1, level 2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.7.12
      - run: mise trust tools/fixtures/mise.toml
      - run: |
          set -o pipefail
          scripts/validate.sh | tee validator-report.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: validator-report
          path: validator-report.txt

  msrv:
    # Stable job name (required status check); the version lives only in
    # Cargo.toml rust-version — derived here, never duplicated. The MSRV
    # toolchain is a sanctioned exception to the everything-via-mise rule:
    # deliberately a second rustup toolchain, bumped manually.
    name: MSRV check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.7.12
      - name: Derive MSRV from Cargo.toml
        run: echo "MSRV=$(taplo get -f Cargo.toml 'workspace.package.rust-version')" >> "$GITHUB_ENV"
      - run: rustup toolchain install "$MSRV" --profile minimal
      - run: rustup run "$MSRV" cargo check --workspace --all-features
