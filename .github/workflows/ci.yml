---
name: ci

"on":
  push:
    # renovate/**: branch-automerge needs the ci check on the branch itself
    # (no PR is opened unless the branch goes red).
    branches: [main, renovate/**]
  pull_request: {}
  schedule:
    # Weekly full gate on main: cargo-deny's advisories check has an input —
    # the RustSec database — that changes without commits; this catches new
    # advisories during quiet weeks. Fingerprinted gates restore the .task
    # cache from the last green run and skip.
    - cron: 0 6 * * 1

permissions:
  contents: read

# A newer push to the same branch supersedes any run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint + test (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        # Both shipping architectures; arm64 runners are free on public
        # repos.
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      # First step of every job, before checkout: runtime egress audit —
      # enforcement per issue #6 canon (allowlist derived from audit run;
      # templates/ci/ in renovate-config).
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          disable-sudo: true
          # Derived from the audit run plus the GitHub-owned
          # cold-cache set (mise tool installs on cache miss).
          # arm leg: community tier skips enforcement (recorded).
          allowed-endpoints: >
            api.github.com:443
            codeload.github.com:443
            crates.io:443
            files.pythonhosted.org:443
            github.com:443
            index.crates.io:443
            mise-versions.jdx.dev:443
            mise.jdx.dev:443
            nodejs.org:443
            objects.githubusercontent.com:443
            pypi.org:443
            raw.githubusercontent.com:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443
            static.crates.io:443
            static.rust-lang.org:443
            tuf-repo-cdn.sigstore.dev:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.7.12
      # go-task fingerprints (Taskfile `sources:`): a hit means a gate's
      # inputs are byte-identical to a run that already passed, so it skips.
      # go-task only writes checksums after a task succeeds, and
      # actions/cache only saves on green jobs, so a failing gate can never
      # be cached green; on restore, task re-verifies every checksum against
      # the actual sources, so a stale entry simply re-runs.
      - name: Cache task fingerprints
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .task
          key: task-fingerprints-${{ matrix.runner }}-${{ github.sha }}
          restore-keys: task-fingerprints-${{ matrix.runner }}-
      # zizmor runs offline everywhere (deterministic gates); its online
      # audits move to the scanner baseline (renovate-config issue #7).
      - run: task ci

  secrets:
    name: gitleaks history scan
    runs-on: ubuntu-latest
    steps:
      # First step of every job, before checkout: runtime egress audit —
      # enforcement per issue #6 canon (allowlist derived from audit run;
      # templates/ci/ in renovate-config).
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          disable-sudo: true
          # gitleaks itself makes no network calls; this is the GitHub-owned
          # cold-cache set (mise tool installs on cache miss).
          allowed-endpoints: >
            api.github.com:443
            codeload.github.com:443
            files.pythonhosted.org:443
            github.com:443
            mise-versions.jdx.dev:443
            mise.jdx.dev:443
            nodejs.org:443
            objects.githubusercontent.com:443
            pypi.org:443
            raw.githubusercontent.com:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443
            static.rust-lang.org:443
            tuf-repo-cdn.sigstore.dev:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # Full history: the scan re-applies the pinned ruleset to every
          # commit, not just the tip (templates/gitleaks/README.md).
          fetch-depth: 0
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.7.12
      - run: task scan:secrets

  validate:
    name: Official IIIF validators (v3 + v2.1, level 2)
    runs-on: ubuntu-latest
    steps:
      # First step of every job, before checkout: runtime egress audit —
      # enforcement per issue #6 canon (allowlist derived from audit run;
      # templates/ci/ in renovate-config).
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          disable-sudo: true
          # Derived from the audit run plus the GitHub-owned
          # cold-cache set (mise tool installs on cache miss).
          allowed-endpoints: >
            api.github.com:443
            codeload.github.com:443
            conda.anaconda.org:443
            crates.io:443
            files.pythonhosted.org:443
            github.com:443
            index.crates.io:443
            mise-versions.jdx.dev:443
            mise.jdx.dev:443
            nodejs.org:443
            objects.githubusercontent.com:443
            pypi.org:443
            raw.githubusercontent.com:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443
            static.crates.io:443
            static.rust-lang.org:443
            tuf-repo-cdn.sigstore.dev:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.7.12
      - run: mise trust tools/fixtures/mise.toml
      - run: |
          set -o pipefail
          scripts/validate.sh | tee validator-report.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: validator-report
          path: validator-report.txt

  msrv:
    # Stable job name (required status check); the version lives only in
    # Cargo.toml rust-version — derived here, never duplicated. The MSRV
    # toolchain is a sanctioned exception to the everything-via-mise rule:
    # deliberately a second rustup toolchain, bumped manually.
    name: MSRV check
    runs-on: ubuntu-latest
    steps:
      # First step of every job, before checkout: runtime egress audit —
      # enforcement per issue #6 canon (allowlist derived from audit run;
      # templates/ci/ in renovate-config).
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          disable-sudo: true
          # Derived from the audit run plus the GitHub-owned
          # cold-cache set (mise tool installs on cache miss).
          allowed-endpoints: >
            api.github.com:443
            codeload.github.com:443
            crates.io:443
            files.pythonhosted.org:443
            github.com:443
            index.crates.io:443
            mise-versions.jdx.dev:443
            mise.jdx.dev:443
            nodejs.org:443
            objects.githubusercontent.com:443
            pypi.org:443
            raw.githubusercontent.com:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443
            static.crates.io:443
            static.rust-lang.org:443
            tuf-repo-cdn.sigstore.dev:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.7.12
      - name: Derive MSRV from Cargo.toml
        run: echo "MSRV=$(taplo get -f Cargo.toml 'workspace.package.rust-version')" >> "$GITHUB_ENV"
      - run: rustup toolchain install "$MSRV" --profile minimal
      - run: rustup run "$MSRV" cargo check --workspace --all-features
