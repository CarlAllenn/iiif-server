# taplo walks the entire tree including .git/ by default. The lefthook
# remote cache (.git/info/lefthook-remotes/) contains TOML formatted under
# its own repo's settings, so VCS internals must be excluded or
# `taplo fmt --check` fails on files that aren't ours. .claude/ is
# machine-local session state (worktrees of other checkouts included).
exclude = [".git/**", ".claude/**"]

[formatting]
# Align the array-expansion threshold with the repo-wide 120-column canon
# (yamllint, markdownlint). Everything else stays at defaults; reorder_keys
# stays off — alphabetical reordering destroys semantic grouping (README.md
# in templates/linters/).
column_width = 120
